<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Bookmark Rules</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8; --card: #ffffff; --text: #1c1c22; --muted: #62626e; --border: #d9d9e0;
    --accent: #4f46e5; --accent-text: #ffffff; --ok: #14733b; --bad: #b3261e; --warn: #8a5a00;
    --field: #ffffff; --chip: #ececf2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171b; --card: #212127; --text: #ececf1; --muted: #a0a0ad; --border: #3a3a44;
      --accent: #8b85ff; --accent-text: #14141a; --ok: #6fd69a; --bad: #ff8a80; --warn: #f0c060;
      --field: #1a1a1f; --chip: #2c2c35;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .switches { display: flex; gap: 20px; flex-wrap: wrap; }
  .sub { color: var(--muted); margin: 4px 0 20px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button, .btn {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 2px 8px; }
  input[type=text], input[type=number], input[type=url], select {
    font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .notice { border: 1px solid var(--border); border-left: 4px solid var(--warn); background: var(--card);
    border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .notice[hidden] { display: none; }
  #status { min-height: 20px; color: var(--muted); margin-bottom: 8px; }
  #status.bad { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
  .card.off .summary-text { opacity: .55; }
  .summary { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .summary-text { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .desc { color: var(--muted); overflow-wrap: anywhere; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { display: inline-block; background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; margin-left: 6px; }
  .badge.warn { color: var(--warn); }
  .badge.bad { color: var(--bad); }
  .editor { border-top: 1px solid var(--border); padding: 14px 12px; display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .field .err { color: var(--bad); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .field[hidden] { display: none; }
  .with-pick { display: flex; gap: 8px; }
  .with-pick select { flex: none; width: auto; max-width: 45%; }
  .invalid { border-color: var(--bad) !important; }
  .checks { display: flex; gap: 20px; flex-wrap: wrap; }
  .checks label, .toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .test { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
  .test h3 { margin: 0; font-size: 14px; }
  .test-out { overflow-wrap: anywhere; }
  .test-out .yes { color: var(--ok); font-weight: 600; }
  .test-out .no { color: var(--bad); font-weight: 600; }
  .test-out dl { margin: 6px 0 0; display: grid; grid-template-columns: 90px 1fr; gap: 2px 10px; }
  .test-out dt { color: var(--muted); }
  .test-out dd { margin: 0; }
  .editor-buttons { display: flex; gap: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 12px; border: 1px dashed var(--border); border-radius: 10px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .summary { flex-wrap: wrap; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Auto Bookmark Rules</h1>
    <div class="switches">
      <label class="toggle"><input type="checkbox" id="toast"> Show a toast when a page is bookmarked</label>
      <label class="toggle"><input type="checkbox" id="paused"> Pause all rules</label>
    </div>
  </header>
  <p class="sub">Pages that match an enabled rule are bookmarked into that rule's folder when they finish loading.</p>

  <div class="toolbar">
    <button id="add" class="primary">Add rule</button>
    <button id="preset">Add Claude Artifacts preset</button>
    <button id="export">Export JSON</button>
    <button id="import">Import JSON</button>
    <label class="toggle"><input type="checkbox" id="import-replace"> Replace existing rules on import</label>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>

  <div id="status" role="status"></div>
  <div id="storage-notice" class="notice" hidden></div>
  <div id="access-notice" class="notice" hidden>
    <span id="access-text"></span>
    <button id="grant-all">Grant site access</button>
  </div>

  <div id="rules"></div>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
